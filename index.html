<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Box Search</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

.container {
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

#search {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  font-size: 18px;
  border-radius: 12px;
  border: 1px solid #555;
  background: #222;
  color: white;
  outline: none;
}

#results {
  margin-top: 15px;
}

.result {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 8px 0;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #292929;
  color: white;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}

.result:hover {
  background: #3a3a3a;
}

#message {
  text-align: center;
  margin-top: 20px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="container">

  <h1>🔍 Anime Box</h1>

  <input
    type="text"
    id="search"
    placeholder="Search anime..."
    autocomplete="off"
  >

  <div id="results"></div>
  <div id="message"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyQc9-QbVYqXWg0j8ztrIIp6_bXd-0-OtL6gSlTvtvjVAemaMeqpkdQygzyoNiRHRY/exec";

let animeList = [];
let dataLoaded = false;

// This receives the anime data from Google Apps Script
function loadAnimeData(data) {

  animeList = data;
  dataLoaded = true;

  console.log("Anime database loaded:", animeList.length);
}

// Load anime database
const script = document.createElement("script");

script.src =
  API_URL +
  "?callback=loadAnimeData&_=" +
  Date.now();

script.onerror = function() {

  document.getElementById("message").textContent =
    "Unable to load anime database.";

};

document.body.appendChild(script);


// Search
const searchBox = document.getElementById("search");
const results = document.getElementById("results");
const message = document.getElementById("message");

searchBox.addEventListener("input", function() {

  const query = this.value.trim().toLowerCase();

  results.innerHTML = "";
  message.textContent = "";

  // Empty search = no results
  if (!query) return;

  // Database still loading
  if (!dataLoaded) {

    message.textContent =
      "Loading anime database...";

    return;
  }

  // Find matching anime
  const matches = animeList.filter(anime =>
    anime.name.toLowerCase().includes(query)
  );

  // No matches
  if (matches.length === 0) {

    message.textContent =
      "No button found";

    return;
  }

  // Create buttons
  matches.forEach(anime => {

    const button =
      document.createElement("button");

    button.className = "result";

    button.textContent =
      anime.name;

    button.onclick = function() {

      window.open(
        anime.url,
        "_blank"
      );

    };

    results.appendChild(button);

  });

});

</script>

</body>
</html>
